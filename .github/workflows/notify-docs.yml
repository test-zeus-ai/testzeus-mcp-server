name: Notify docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-docs:
    name: Add the PR info in docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build docs payload
        id: docs-payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node scripts/release/build-docs-payload.mjs > docs-payload.json
          echo "count=$(jq '.changes | length' docs-payload.json)" >> "$GITHUB_OUTPUT"

      - name: Generate docs dispatch token
        if: steps.docs-payload.outputs.count != '0'
        id: docs-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: test-zeus-ai
          repositories: testzeus-docs
          permission-contents: write

      - name: Trigger testzeus-docs intake
        if: steps.docs-payload.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.docs-app-token.outputs.token }}
        run: |
          jq '{event_type: "source-updated", client_payload: .}' docs-payload.json > docs-dispatch.json
          gh api repos/test-zeus-ai/testzeus-docs/dispatches --input docs-dispatch.json

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Generate testzeus-sdk checkout token
        id: sdk-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: test-zeus-ai
          repositories: testzeus-sdk

      - name: Checkout testzeus-sdk
        uses: actions/checkout@v5
        with:
          repository: test-zeus-ai/testzeus-sdk
          ref: dev
          path: .deps/testzeus-sdk
          token: ${{ steps.sdk-token.outputs.token }}

      - name: Install dependencies
        run: |
          set +e
          uv sync --dev
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Installed dependencies from package indexes"
            exit 0
          fi
          echo "testzeus-sdk is unpublished; using GitHub checkout at .deps/testzeus-sdk"
          printf '\n[tool.uv.sources]\ntestzeus-sdk = { path = ".deps/testzeus-sdk" }\n' >> pyproject.toml
          uv lock --upgrade-package testzeus-sdk
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check testzeus_mcp_server/

      - name: Run formatting check
        run: |
          uv run ruff format --check testzeus_mcp_server/ 

      - name: Run tests
        env:
          TESTZEUS_EMAIL: ${{ secrets.TESTZEUS_EMAIL }}
          TESTZEUS_PASSWORD: ${{ secrets.TESTZEUS_PASSWORD }}
          TESTZEUS_BASE_URL: ${{ secrets.TESTZEUS_BASE_URL }}
        run: |
          uv run pytest -v 2>/dev/null || echo "No tests to run"

      - name: Check build
        run: |
          uv build 